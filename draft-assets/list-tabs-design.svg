<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" viewBox="0 0 1360 660" fill="none">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="384" y2="374" gradientUnits="userSpaceOnUse"><stop stop-color="#2B78D8"/><stop offset=".52" stop-color="#174FA7"/><stop offset="1" stop-color="#092B68"/></linearGradient>
 <linearGradient id="content" x1="0" y1="0" x2="384" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#F2F8FF"/><stop offset="1" stop-color="#D8E8F8"/></linearGradient>
 <filter id="shadow" x="-30" y="-20" width="470" height="480" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#07183E" flood-opacity=".34"/></filter>
 <clipPath id="clip"><rect x="8" y="8" width="384" height="374" rx="24"/></clipPath>
</defs>
<rect width="1360" height="660" rx="28" fill="#EEF4FA"/>
<text x="48" y="49" fill="#173759" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700">一窗多清单 · 侧边标签</text>
<text x="48" y="77" fill="#526B86" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">日常和临时项目分开保存；窗口位置不变，切换后新增事项归属当前清单。</text>
<!-- shared window drawing instances -->
<g transform="translate(42 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381.3 8 392 18.7 392 32V68H8V32C8 18.7 18.7 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/>
<text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">Today’s focus</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
<rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<!-- tabs --> <rect x="25" y="78" width="346" height="34" rx="10" fill="#C9DFF2"/><rect x="27" y="80" width="104" height="30" rx="8" fill="#FFFFFF"/><text x="43" y="100" fill="#173759" font-family="Segoe UI" font-size="12" font-weight="700">Daily</text><rect x="136" y="80" width="114" height="30" rx="8" fill="#D8EAF9"/><text x="150" y="100" fill="#426886" font-family="Segoe UI" font-size="12">Release</text><text x="352" y="100" fill="#2568B5" font-family="Segoe UI" font-size="18" font-weight="600">+</text>
<g font-family="Segoe UI" font-size="14" fill="#173759"><circle cx="43" cy="145" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="150">Review project notes</text><circle cx="43" cy="192" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="197">Polish the home screen</text><circle cx="43" cy="239" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="244">Send the weekly update</text></g><path d="M30 286H370" stroke="#BDD3E8"/><path d="M32 310h12m-6-6v12" stroke="#2568B5" stroke-width="1.8" stroke-linecap="round"/><text x="56" y="315" fill="#2568B5" font-family="Segoe UI" font-size="13" font-weight="600">Add task to Daily</text></g>
<text x="50" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">01 · 日常清单</text><text x="50" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">默认打开；当前标签与添加入口都明确指向 Daily。</text>
<!-- project state -->
<g transform="translate(480 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381.3 8 392 18.7 392 32V68H8V32C8 19 19 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/><text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">Release notes</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/><rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<rect x="25" y="78" width="346" height="34" rx="10" fill="#C9DFF2"/><rect x="27" y="80" width="114" height="30" rx="8" fill="#D8EAF9"/><text x="43" y="100" fill="#426886" font-family="Segoe UI" font-size="12">Daily</text><rect x="144" y="80" width="126" height="30" rx="8" fill="#FFFFFF"/><text x="158" y="100" fill="#173759" font-family="Segoe UI" font-size="12" font-weight="700">Release notes</text><text x="352" y="100" fill="#2568B5" font-family="Segoe UI" font-size="18" font-weight="600">+</text>
<g font-family="Segoe UI" font-size="14" fill="#173759"><circle cx="43" cy="145" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="150">Confirm launch checklist</text><circle cx="43" cy="192" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="197">Send release announcement</text></g><path d="M30 286H370" stroke="#BDD3E8"/><path d="M32 310h12m-6-6v12" stroke="#2568B5" stroke-width="1.8" stroke-linecap="round"/><text x="56" y="315" fill="#2568B5" font-family="Segoe UI" font-size="13" font-weight="600">Add task to Release notes</text></g>
<text x="488" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">02 · 临时项目</text><text x="488" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">切换标签后标题和 Add task 同步更新，避免记错清单。</text>
<!-- add list state -->
<g transform="translate(918 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381.3 8 392 18.7 392 32V68H8V32C8 19 19 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/><text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">New list</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/><rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<rect x="25" y="78" width="346" height="34" rx="10" fill="#C9DFF2"/><rect x="27" y="80" width="114" height="30" rx="8" fill="#D8EAF9"/><text x="43" y="100" fill="#426886" font-family="Segoe UI" font-size="12">Daily</text><rect x="144" y="80" width="126" height="30" rx="8" fill="#FFFFFF"/><text x="158" y="100" fill="#173759" font-family="Segoe UI" font-size="12" font-weight="700">New list</text><rect x="289" y="80" width="72" height="30" rx="8" fill="#FFFFFF" stroke="#2568B5"/><text x="301" y="100" fill="#2568B5" font-family="Segoe UI" font-size="12" font-weight="600">Create</text>
<rect x="25" y="132" width="346" height="38" rx="8" fill="white" stroke="#397ABC"/><text x="38" y="156" fill="#173759" font-family="Segoe UI" font-size="14">Project name</text><text x="38" y="203" fill="#526B86" font-family="Microsoft YaHei" font-size="12">建议使用短名称，例如：Release notes</text><path d="M30 286H370" stroke="#BDD3E8"/><path d="M32 310h12m-6-6v12" stroke="#2568B5" stroke-width="1.8" stroke-linecap="round"/><text x="56" y="315" fill="#2568B5" font-family="Segoe UI" font-size="13" font-weight="600">Add task</text></g>
<text x="926" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">03 · 新建清单</text><text x="926" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">使用 + 创建项目标签；名称简短，完成后可归档。</text>
<text x="48" y="620" fill="#526B86" font-family="Microsoft YaHei" font-size="13">设计决策：一个窗口承载多个清单；每个清单独立保存事项、顺序和滚动位置。第一版不做多窗口。</text>
</svg>