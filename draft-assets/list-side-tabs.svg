<rect x="25" y="132" width="346" height="38" rx="8" fill="white" stroke="#397ABC" /><text x="38" y="156" fill="#173759" font-family="Segoe UI" font-size="14">Client demo</text><text x="38" y="203" fill="#526B86" font-family="Segoe UI" font-size="12">Enter to create · Esc to cancel</text><path d="M30 286H370" stroke="#BDD3E8" /><path d="M392 82H480Q490 82 490 92V106Q490 116 480 116H392Z" fill="#23558D" stroke="#23558D" /><text x="403" y="104" fill="#F3FAFF" font-family="Segoe UI" font-size="12" font-weight="400">Daily</text><path d="M392 127H480Q490 127 490 137V151Q490 161 480 161H392Z" fill="#23558D" stroke="#23558D" /><text x="403" y="149" fill="#F3FAFF" font-family="Segoe UI" font-size="12" font-weight="400">Release</text><path d="M392 172H480Q490 172 490 182V196Q490 206 480 206H392Z" fill="#E8F3FD" stroke="#A8C7E4" /><text x="403" y="194" fill="#173759" font-family="Segoe UI" font-size="12" font-weight="600">+ New list</text><rect x="25" y="224" width="86" height="32" rx="6" fill="#2568B5" /><text x="47" y="245" fill="white" font-family="Segoe UI" font-size="13">Create</text><text x="132" y="245" fill="#426886" font-family="Segoe UI" font-size="13">Cancel</text></g>
<text x="1150" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">03 · 新建清单</text><text x="1150" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">点击 + New list 输入名称；创建后进入新清单。</text>
<text x="48" y="620" fill="#526B86" font-family="Microsoft YaHei" font-size="13">每个清单独立保存事项、顺序和滚动位置；项目标签右键提供重命名与归档，Daily 固定保留。</text>
