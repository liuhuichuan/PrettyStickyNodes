<text x="48" y="49" fill="#173759" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700">一窗多清单 · 侧边标签</text>
<text x="48" y="77" fill="#526B86" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">日常和临时项目分开保存；窗口位置不变，切换后新增事项归属当前清单。</text>

