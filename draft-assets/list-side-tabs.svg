<text x="50" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">01 · 日常清单</text><text x="50" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">侧边标签不占正文高度；日常与项目独立保存。</text>

