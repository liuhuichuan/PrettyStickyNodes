<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#2672CF" /><stop offset="1" stop-color="#0B306F" /></linearGradient></defs><rect width="1000" height="760" fill="#EEF4FA" /><g font-family="Segoe UI, Inter, sans-serif"><text x="60" y="55" font-size="26" font-weight="700" fill="#173354">添加事项：入口看得见，点击即可输入</text><text x="60" y="85" font-size="14" fill="#506580">入口跟随列表末尾；四条待办之后，始终有明确的文字操作。</text><g transform="translate(60 125)"><rect width="400" height="490" rx="22" fill="url(#blue)" /><text x="26" y="39" fill="white" font-size="17" font-weight="700">QUICK NOTE</text><path d="M364 25l12 12m0-12l-12 12" stroke="white" stroke-width="2" stroke-linecap="round" /><rect x="18" y="68" width="364" height="404" rx="16" fill="#EEF6FF" /><text x="40" y="108" font-size="21" font-weight="700" fill="#15345F">Today’s focus</text><path d="M40 128H360" stroke="#CADBEC" /><circle cx="49" cy="163" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="168" fill="#173354" font-size="15">Review meeting notes</text><circle cx="49" cy="215" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="220" fill="#173354" font-size="15">Confirm the design</text><circle cx="49" cy="267" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="272" fill="#173354" font-size="15">Send the weekly update</text><circle cx="49" cy="319" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="324" fill="#173354" font-size="15">Buy coffee beans</text><rect x="36" y="351" width="328" height="44" rx="9" fill="#DCEBFC" /><path d="M49 373h14m-7-7v14" stroke="#185BAA" stroke-width="2" stroke-linecap="round" /><text x="73" y="378" fill="#185BAA" font-size="15" font-weight="700">Add task</text></g><g transform="translate(540 125)"><rect width="400" height="490" rx="22" fill="url(#blue)" /><text x="26" y="39" fill="white" font-size="17" font-weight="700">QUICK NOTE</text><path d="M364 25l12 12m0-12l-12 12" stroke="white" stroke-width="2" stroke-linecap="round" /><rect x="18" y="68" width="364" height="404" rx="16" fill="#EEF6FF" /><text x="40" y="108" font-size="21" font-weight="700" fill="#15345F">Today’s focus</text><path d="M40 128H360" stroke="#CADBEC" /><circle cx="49" cy="163" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="168" fill="#173354" font-size="15">Review meeting notes</text><circle cx="49" cy="215" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="220" fill="#173354" font-size="15">Confirm the design</text><circle cx="49" cy="267" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="272" fill="#173354" font-size="15">Send the weekly update</text><circle cx="49" cy="319" r="9" fill="none" stroke="#4384C7" stroke-width="1.6" /><text x="73" y="324" fill="#173354" font-size="15">Buy coffee beans</text><rect x="36" y="351" width="328" height="52" rx="9" fill="white" stroke="#1B69C4" stroke-width="2" /><text x="49" y="383" fill="#173354" font-size="15">Book a meeting room</text><path d="M211 368v20" stroke="#1B69C4" /><rect x="300" y="361" width="54" height="32" rx="6" fill="#185CB1" /><text x="327" y="382" text-anchor="middle" fill="white" font-size="13">Add</text><text x="40" y="432" fill="#526982" font-size="12">Enter to add · Esc to cancel</text></g><text x="60" y="653" fill="#163C6B" font-size="18" font-weight="700">01 · 默认状态</text><text x="60" y="683" fill="#506580" font-size="14">加号 + 文字 + 轻底色，整行都可以点击。</text><text x="540" y="653" fill="#163C6B" font-size="18" font-weight="700">02 · 输入状态</text><text x="540" y="683" fill="#506580" font-size="14">自动聚焦；点击「添加」或按 Enter 提交。</text><text x="540" y="708" fill="#506580" font-size="14">提交后清空输入框，可连续添加。</text></g></svg>