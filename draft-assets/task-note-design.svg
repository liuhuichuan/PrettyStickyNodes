<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="700" viewBox="0 0 1660 700" fill="none">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="384" y2="374" gradientUnits="userSpaceOnUse"><stop stop-color="#2B78D8"/><stop offset=".52" stop-color="#174FA7"/><stop offset="1" stop-color="#092B68"/></linearGradient>
 <linearGradient id="content" x1="0" y1="0" x2="384" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#F2F8FF"/><stop offset="1" stop-color="#D8E8F8"/></linearGradient>
 <filter id="shadow" x="-30" y="-20" width="500" height="510" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#07183E" flood-opacity=".34"/></filter>
 <clipPath id="clip"><rect x="8" y="8" width="384" height="374" rx="24"/></clipPath>
</defs>
<rect width="1660" height="700" rx="28" fill="#EEF4FA"/>
<text x="48" y="49" fill="#173759" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700">Task + Note · 长内容备忘</text>
<text x="48" y="77" fill="#526B86" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">同一清单共存两种内容：Task 负责执行，Note 负责记录；不切换全局模式。</text>
<!-- state 1 -->
<g transform="translate(42 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381 8 392 19 392 32V68H8V32C8 19 19 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/><text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">Release</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/><rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<path d="M30 86H370" stroke="#BDD3E8"/><text x="30" y="105" fill="#526B86" font-family="Segoe UI" font-size="11" font-weight="700">TASKS</text>
<g font-family="Segoe UI" font-size="13" fill="#173759"><circle cx="43" cy="133" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="138">Confirm launch checklist</text><circle cx="43" cy="172" r="8" fill="none" stroke="#397ABC" stroke-width="1.5"/><text x="65" y="177">Send release announcement</text></g>
<path d="M30 204H370" stroke="#BDD3E8"/><text x="30" y="223" fill="#526B86" font-family="Segoe UI" font-size="11" font-weight="700">NOTES</text><rect x="28" y="235" width="344" height="62" rx="9" fill="#E7F2FC" stroke="#B8D2E8"/><circle cx="48" cy="255" r="9" fill="#2568B5"/><text x="44" y="259" fill="white" font-family="Segoe UI" font-size="10" font-weight="700">N</text><text x="68" y="257" fill="#173759" font-family="Segoe UI" font-size="13" font-weight="700">Release notes</text><text x="68" y="278" fill="#526B86" font-family="Segoe UI" font-size="11"># Launch checklist · contacts · links…</text><path d="M30 326H370" stroke="#BDD3E8"/><text x="30" y="350" fill="#2568B5" font-family="Segoe UI" font-size="13" font-weight="600">+ Add</text><text x="86" y="350" fill="#526B86" font-family="Segoe UI" font-size="12">Task or Note</text></g>
<text x="50" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">01 · 同一清单混合显示</text><text x="50" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">Task 可完成和排序；Note 点击展开，全文在详情内滚动。</text>
<!-- state 2 add menu -->
<g transform="translate(600 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381 8 392 19 392 32V68H8V32C8 19 19 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/><text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">Release</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/><rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<path d="M30 326H370" stroke="#BDD3E8"/><rect x="28" y="272" width="150" height="42" rx="9" fill="#FFFFFF" stroke="#76A9D7"/><text x="49" y="298" fill="#173759" font-family="Segoe UI" font-size="13" font-weight="600">✓ Task</text><rect x="190" y="272" width="150" height="42" rx="9" fill="#123B75"/><text x="212" y="298" fill="#FFFFFF" font-family="Segoe UI" font-size="13" font-weight="600">▤ Note</text><text x="30" y="351" fill="#2568B5" font-family="Segoe UI" font-size="13" font-weight="600">+ Add</text><text x="86" y="351" fill="#526B86" font-family="Segoe UI" font-size="12">Choose a content type</text></g>
<text x="608" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">02 · + Add 选择类型</text><text x="608" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">用户不需要先切换模式，直接选择要添加 Task 还是 Note。</text>
<!-- state 3 note editor -->
<g transform="translate(1158 114)" filter="url(#shadow)"><rect x="8" y="8" width="384" height="374" rx="24" fill="url(#shell)"/><path d="M32 8H368C381 8 392 19 392 32V68H8V32C8 19 19 8 32 8Z" fill="#082B6B" opacity=".72"/><path d="M32 8H368C381 8 392 19 392 32V46C280 68 140 56 8 38V32C8 19 19 8 32 8Z" fill="#81C8FF" opacity=".18"/><text x="28" y="39" fill="#F3FAFF" font-family="Segoe UI" font-size="16" font-weight="700">Release notes</text><path d="M354 27l12 12M366 27l-12 12" stroke="white" stroke-width="2.6" stroke-linecap="round"/><rect x="8" y="62" width="384" height="320" fill="url(#content)" clip-path="url(#clip)"/>
<rect x="28" y="84" width="344" height="34" rx="7" fill="#FFFFFF" stroke="#397ABC"/><text x="42" y="106" fill="#173759" font-family="Segoe UI" font-size="13" font-weight="700">Release notes</text><rect x="28" y="128" width="344" height="146" rx="8" fill="#FFFFFF" stroke="#397ABC"/><text x="42" y="151" fill="#173759" font-family="Consolas, Segoe UI" font-size="12"># Launch checklist</text><text x="42" y="173" fill="#173759" font-family="Consolas, Segoe UI" font-size="12">- Confirm owner</text><text x="42" y="195" fill="#173759" font-family="Consolas, Segoe UI" font-size="12">- Add release link</text><text x="42" y="229" fill="#526B86" font-family="Segoe UI" font-size="11">Markdown is saved as plain text.</text><rect x="28" y="290" width="96" height="32" rx="7" fill="#2568B5"/><text x="54" y="311" fill="white" font-family="Segoe UI" font-size="12" font-weight="600">Save</text><text x="147" y="311" fill="#2568B5" font-family="Segoe UI" font-size="12" font-weight="600">Preview</text><text x="30" y="351" fill="#526B86" font-family="Segoe UI" font-size="11">Enter: new line · Ctrl+Enter: save</text></g>
<text x="1166" y="535" fill="#173759" font-family="Microsoft YaHei" font-size="16" font-weight="700">03 · Note 编辑</text><text x="1166" y="562" fill="#526B86" font-family="Microsoft YaHei" font-size="12">标题 + 多行 Markdown 原文；可保存或预览，不影响 Task。</text>
<text x="48" y="635" fill="#526B86" font-family="Microsoft YaHei" font-size="13">设计决策：Note 是清单中的第二种内容类型；第一版保存 Markdown 原文，预览为轻量基础渲染，不引入全局模式切换。</text>
</svg>